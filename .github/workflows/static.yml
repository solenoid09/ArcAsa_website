# Builds the React site in my-app/ and publishes it to GitHub Pages.
# Save as: .github/workflows/static.yml   (replace the old file)
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  # Lets you run it by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # The address of a normal project site is https://<user>.github.io/<repository>/
  # so the site lives under /<repository>/.
  # Using a custom domain, or a repository named <user>.github.io? Change this to "/".
  BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install packages
        working-directory: my-app
        run: npm ci

      - name: Build
        working-directory: my-app
        run: npm run build -- --base="$BASE_PATH"

      # Pages answers any unknown address with 404.html. Serving the app's own page there
      # lets a refresh on /services or /appointments open the right page.
      - name: Make refresh on inner pages work
        run: cp my-app/dist/index.html my-app/dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: my-app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
